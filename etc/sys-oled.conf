[main]
# Define your OLED display model
# Check luma.oled project to check supported displays.
display_model = ssd1306

# Define OLED display contrast level (value: 0 to 255)
contrast = 255

# Show Armbian logo (value: yes or no)
show_logo = no

# Status refresh interval
refresh = 3

show_cpu_temp = yes
show_cpu_load = no
show_fan_rpm = yes
#show_load_average = 0,1,2
show_info = no
show_disk_info = yes
# Show hottest array drive temp via smartctl (never wakes a sleeping drive; shows "zzz" when all are in standby)
show_drive_temp = yes

[device]
# Network Device
network_name = eth0

max_cpu_temp = 60
# disable. We expect 0 speed
low_fan_rpm = -1

# Drive temp alarm threshold (degrees C) and the drives to poll (comma separated; /dev/disk/by-id paths work too)
max_drive_temp = 52
drive_devices = /dev/sdc,/dev/sdd
# drive-temp-guard (cron, every 5 min) powers the machine off if any drive exceeds this (degrees C)
shutdown_drive_temp = 55

[storage.sdram]
name = root
dir = /

[storage.raid]
name = raid
dir = /data
